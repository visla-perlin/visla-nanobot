apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.app.name }}-ingress
  # IMPORTANT: this ingress needs to be in the same namespace as the istio-ingressgateway svc
  namespace: istio-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: {{ .Values.environment.name }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/target-node-labels: k8s.visla.us/node-group=DEFAULT
    {{- if .Values.waf_acl_id }}
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:{{ .Values.aws_partition }}:wafv2:{{ .Values.region }}:{{ .Values.aws_account_id}}:regional/webacl/{{ .Values.region }}-webacl/{{ .Values.waf_acl_id}}
    {{- end }}
    ## SSL Settings
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301" }}'
    # eliminate alb.ingress.kubernetes.io/certificate-arn annotation enables cert auto-discovery
    ## WebSockets for the WebUI channel
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
spec:
  rules:
    - host: "{{ .Values.host }}"
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: ssl-redirect
                port:
                  name: use-annotation
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: istio-ingressgateway
                port:
                  number: 80
